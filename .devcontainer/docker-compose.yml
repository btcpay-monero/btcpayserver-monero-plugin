services:
  devcontainer:
    build:
      context: .
    container_name: devcontainer
    ipc: host
    init: true
    cap_add:
      - SYS_ADMIN
    depends_on:
      - postgres
      - xmr_wallet
    shm_size: '1gb'
    environment:
      BTCPAY_NODEFAULTCHAIN: "true"
      BTCPAY_POSTGRES: "User ID=postgres;Include Error Detail=true;Host=postgres;Port=5432;Database=btcpayserver"
      TESTS_POSTGRES: "User ID=postgres;Include Error Detail=true;Host=postgres;Port=5432;Database=btcpayserver"
      BTCPAY_XMR_DAEMON_URI: http://monerod:18081
      BTCPAY_XMR_WALLET_DAEMON_URI: http://xmr_wallet:18082
      BTCPAY_XMR_WALLET_DAEMON_WALLETDIR: /wallet
      TESTS_INCONTAINER: "true"
      PLAYWRIGHT_HEADLESS: "false"
      NUGET_PACKAGES: /home/ubuntu/.nuget/packages
      DISPLAY: ":1"
    volumes:
      - ..:/workspace
      - xmr_wallet:/wallet
    ports:
      - "14142:14142"
      - "6080:6080"
    command: sleep infinity

  monerod:
    image: btcpayserver/monero:0.18.4.3
    restart: unless-stopped
    container_name: monerod
    command: monerod --fixed-difficulty 1 --log-level=2 --rpc-bind-ip=0.0.0.0 --confirm-external-bind --rpc-bind-port=18081 --block-notify="/bin/sh ./scripts/notifier.sh -k -X GET 'http://devcontainer:14142/monerolikedaemoncallback/block?cryptoCode=xmr&hash=%s'" --regtest --no-igd --hide-my-port --offline --non-interactive
    volumes:
      - xmr_data:/data

  xmr_wallet:
    image: btcpayserver/monero:0.18.4.3
    restart: unless-stopped
    container_name: xmr_wallet
    command: monero-wallet-rpc --log-level 2 --allow-mismatched-daemon-version --rpc-bind-ip=0.0.0.0 --disable-rpc-login --confirm-external-bind --rpc-bind-port=18082 --non-interactive --trusted-daemon --daemon-address=monerod:18081 --wallet-dir=/wallet --tx-notify="/bin/sh ./scripts/notifier.sh -k -X GET 'http://devcontainer:14142/monerolikedaemoncallback/tx?cryptoCode=xmr&hash=%s'"
    volumes:
      - xmr_wallet:/wallet
    depends_on:
      - monerod

  postgres:
    image: postgres:17.4
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

volumes:
  xmr_data:
  xmr_wallet:
